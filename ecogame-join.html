<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><link rel="icon" href="iconca.jpg" type="image/jpeg"/><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoGame — Войти в игру</title>
<link rel="icon" href="iconca.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase2.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Nunito','Noto Sans',sans-serif;
  min-height:100vh;
  background:linear-gradient(160deg,#0D2818 0%,#1B5E20 40%,#2E7D32 100%);
  display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:hidden;position:relative;
}
/* animated blobs */
.blob{position:fixed;border-radius:50%;pointer-events:none;animation:float 6s ease-in-out infinite;}
.b1{width:400px;height:400px;background:rgba(76,175,80,0.15);top:-100px;right:-100px;animation-delay:0s;}
.b2{width:300px;height:300px;background:rgba(129,199,132,0.1);bottom:-80px;left:-80px;animation-delay:-3s;}
.b3{width:200px;height:200px;background:rgba(46,204,113,0.12);top:50%;left:10%;animation-delay:-1.5s;}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(5deg)}}

/* floating particles */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.particle{position:absolute;font-size:20px;animation:rise 8s ease-in infinite;opacity:0;}
@keyframes rise{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.8}90%{opacity:.4}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}

.wrap{width:100%;max-width:400px;position:relative;z-index:1;}

/* logo */
.logo-area{text-align:center;margin-bottom:28px;}
.logo-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,0.2);border-radius:20px;padding:10px 20px;margin-bottom:16px;}
.logo-img{width:36px;height:36px;border-radius:10px;object-fit:cover;}
.logo-name{font-size:17px;font-weight:900;color:#fff;}
.logo-game{background:linear-gradient(90deg,#A5D6A7,#81C784);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:13px;font-weight:900;letter-spacing:1px;}
.join-title{font-size:30px;font-weight:900;color:#fff;margin-bottom:6px;text-shadow:0 4px 16px rgba(0,0,0,0.3);}
.join-sub{font-size:14px;color:rgba(255,255,255,0.75);font-weight:600;}

/* card */
.card{background:rgba(255,255,255,0.97);border-radius:24px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.5);}

/* lang */
.lsw{display:flex;background:#E8F5E9;border-radius:20px;padding:3px;margin-bottom:20px;width:fit-content;margin-left:auto;}
.lb{padding:5px 12px;border-radius:17px;border:none;background:transparent;font-size:11px;font-weight:800;cursor:pointer;color:#1B5E20;}
.lb.on{background:#2E7D32;color:#fff;}

/* code input */
.code-input-wrap{margin-bottom:20px;}
.code-label{font-size:13px;font-weight:800;color:#0f172a;margin-bottom:10px;display:block;}
.code-boxes{display:flex;gap:8px;justify-content:center;}
.cbox{width:50px;height:60px;border:2.5px solid #e2e8f0;border-radius:14px;font-size:24px;font-weight:900;text-align:center;text-transform:uppercase;background:#f8fafc;color:#0f172a;outline:none;transition:all .2s;font-family:'Nunito';}
.cbox:focus{border-color:#4CAF50;background:#fff;box-shadow:0 0 0 3px rgba(76,175,80,0.15);}

/* nickname */
.fg{margin-bottom:16px;}
.fl{font-size:13px;font-weight:800;color:#0f172a;margin-bottom:8px;display:block;}
.fi{width:100%;padding:12px 14px 12px 42px;border-radius:12px;border:2px solid #e2e8f0;font-size:14px;font-weight:600;color:#0f172a;background:#f8fafc;outline:none;transition:all .2s;font-family:'Nunito';}
.fi:focus{border-color:#4CAF50;background:#fff;box-shadow:0 0 0 3px rgba(76,175,80,0.1);}
.iw{position:relative;}
.ii{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}

/* emoji picker */
.emoji-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.emj{font-size:22px;cursor:pointer;padding:6px;border-radius:10px;border:2px solid transparent;transition:all .2s;}
.emj.sel{background:#E8F5E9;border-color:#4CAF50;transform:scale(1.15);}
.emj:hover{transform:scale(1.1);}

/* msg */
.msg{border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px;display:none;}
.msg.err{background:#FFEBEE;color:#C62828;border:1px solid #FFCDD2;}
.msg.ok{background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9;}

/* submit */
.sbtn{
  width:100%;padding:15px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#1B5E20,#43A047);
  color:#fff;font-size:16px;font-weight:900;cursor:pointer;
  transition:all .2s;margin-top:6px;
  box-shadow:0 6px 20px rgba(27,94,32,0.4);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Nunito';
}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(27,94,32,0.5);}
.sbtn .sp{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
.sbtn.ld .bt{display:none;}.sbtn.ld .sp{display:block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* waiting screen */
.waiting{text-align:center;padding:24px 0;}
.waiting-emoji{font-size:60px;margin-bottom:12px;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.waiting-title{font-size:18px;font-weight:900;color:#0f172a;margin-bottom:6px;}
.waiting-sub{font-size:13px;color:#64748b;font-weight:600;}
.waiting-code{font-size:28px;font-weight:900;color:#1B5E20;letter-spacing:4px;margin:12px 0;background:#E8F5E9;padding:10px 20px;border-radius:12px;display:inline-block;}

@media(max-width:380px){.cbox{width:42px;height:54px;font-size:20px;}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="wrap">
  <div class="logo-area">
    <div class="logo-badge">
      <img src="iconca.jpg" class="logo-img" alt="EcoBala">
      <div>
        <div class="logo-name">EcoBala</div>
        <div class="logo-game">ECO GAME</div>
      </div>
    </div>
    <div class="join-title" id="jTitle">Войти в игру</div>
    <div class="join-sub" id="jSub">Введи код комнаты и никнейм</div>
  </div>

  <div class="card">
    <div class="lsw">
      <button class="lb on" data-l="ru">РУС</button>
      <button class="lb" data-l="kz">ҚАЗ</button>
    </div>

    <div id="joinForm">
      <div class="msg err" id="eMsg"></div>
      <div class="msg ok" id="oMsg"></div>

      <div class="code-input-wrap">
        <label class="code-label" id="codeLbl">🎮 Код комнаты</label>
        <div class="code-boxes" id="codeBoxes">
          <input class="cbox" maxlength="1" type="text" autocomplete="off">
          <input class="cbox" maxlength="1" type="text" autocomplete="off">
          <input class="cbox" maxlength="1" type="text" autocomplete="off">
          <input class="cbox" maxlength="1" type="text" autocomplete="off">
          <input class="cbox" maxlength="1" type="text" autocomplete="off">
          <input class="cbox" maxlength="1" type="text" autocomplete="off">
        </div>
      </div>

      <div class="fg">
        <label class="fl" id="nickLbl">👤 Никнейм</label>
        <div class="iw">
          <span class="ii" id="selectedEmoji">🌱</span>
          <input class="fi" id="iNick" type="text" placeholder="ЭкоГерой123" maxlength="20" autocomplete="off">
        </div>
        <div class="emoji-row" id="emojiRow"></div>
      </div>

      <button class="sbtn" id="sbtn" onclick="joinGame()">
        <span class="bt" id="joinBtnTxt">Войти в игру 🚀</span>
        <div class="sp"></div>
      </button>
    </div>

    <div id="waitingScreen" style="display:none;">
      <div class="waiting">
        <div class="waiting-emoji">🌱</div>
        <div class="waiting-title" id="wTitle">Ты в лобби!</div>
        <div class="waiting-sub" id="wSub">Ждём начала игры от учителя...</div>
        <div class="waiting-code" id="wCode"></div>
        <div style="font-size:13px;color:#64748b;font-weight:600;margin-top:8px;" id="wPlayerCount">0 игроков ждут</div>
      </div>
    </div>
  </div>
</div>

<script>
// ══ PARTICLES ══
const emojis=['🌱','🌿','🍀','🌳','🦋','🐝','🌸','🌻'];
const pEl=document.getElementById('particles');
for(let i=0;i<12;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.textContent=emojis[i%emojis.length];
  p.style.left=Math.random()*100+'%';
  p.style.animationDelay=Math.random()*8+'s';
  p.style.animationDuration=(6+Math.random()*4)+'s';
  pEl.appendChild(p);
}

// ══ EMOJI PICKER ══
const EMOJIS=['🌱','🌿','🍀','🌳','🦋','🐝','🌸','🌻','🦊','🐬','🌈','⭐','🚀','🎯','💡','🔥'];
let selEmoji='🌱';
const emojiRow=document.getElementById('emojiRow');
EMOJIS.forEach(e=>{
  const b=document.createElement('span');
  b.className='emj'+(e===selEmoji?' sel':'');
  b.textContent=e;
  b.onclick=()=>{
    selEmoji=e;
    document.getElementById('selectedEmoji').textContent=e;
    document.querySelectorAll('.emj').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  };
  emojiRow.appendChild(b);
});

// ══ CODE BOXES ══
const boxes=[...document.querySelectorAll('.cbox')];
boxes.forEach((b,i)=>{
  b.addEventListener('input',e=>{
    b.value=b.value.toUpperCase().replace(/[^A-Z0-9]/,'');
    if(b.value&&i<5) boxes[i+1].focus();
  });
  b.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&!b.value&&i>0) boxes[i-1].focus();
  });
});

// ══ URL CODE ══
const params=new URLSearchParams(location.search);
const urlCode=params.get('code')||'';
if(urlCode.length===6){
  urlCode.split('').forEach((c,i)=>{ if(boxes[i]) boxes[i].value=c; });
}

function getCode(){ return boxes.map(b=>b.value).join(''); }

// ══ TRANSLATIONS ══
const T={
  ru:{title:'Войти в игру',sub:'Введи код комнаты и никнейм',code:'🎮 Код комнаты',nick:'👤 Никнейм',btn:'Войти в игру 🚀',wTitle:'Ты в лобби!',wSub:'Ждём начала игры от учителя...',wPlayers:'игроков ждут',eCode:'Введи код комнаты (6 символов)',eNick:'Введи никнейм',eNotFound:'Комната не найдена!',eStarted:'Игра уже началась!',ok:'✅ Ты в игре!'},
  kz:{title:'Ойынға кіру',sub:'Бөлме кодын және лақап атыңды енгіз',code:'🎮 Бөлме коды',nick:'👤 Лақап ат',btn:'Ойынға кіру 🚀',wTitle:'Сен лоббидесің!',wSub:'Мұғалімнің ойынды бастауын күтеміз...',wPlayers:'ойыншы күтеді',eCode:'Бөлме кодын енгіз (6 таңба)',eNick:'Лақап атыңды енгіз',eNotFound:'Бөлме табылмады!',eStarted:'Ойын басталып кетті!',ok:'✅ Сен ойындасың!'}
};
let lang=localStorage.getItem('selectedLanguage')||'ru';
function t(k){return T[lang][k]||k;}
function setLang(l){lang=l;localStorage.setItem('selectedLanguage',l);document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',b.dataset.l===l));applyT();}
function applyT(){
  document.getElementById('jTitle').textContent=t('title');
  document.getElementById('jSub').textContent=t('sub');
  document.getElementById('codeLbl').textContent=t('code');
  document.getElementById('nickLbl').textContent=t('nick');
  document.getElementById('joinBtnTxt').textContent=t('btn');
}
document.querySelectorAll('.lb').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));

function se(m){const e=document.getElementById('eMsg');e.textContent=m;e.style.display='block';document.getElementById('oMsg').style.display='none';}
function so(m){const e=document.getElementById('oMsg');e.textContent=m;e.style.display='block';document.getElementById('eMsg').style.display='none';}

// ══ SUPABASE ══
async function getSb(){if(typeof EcoBalaAuth!=='undefined'&&EcoBalaAuth.supabase)return EcoBalaAuth.supabase;return null;}

// ══ JOIN GAME ══
let myParticipantId=null;
let myRoomId=null;
let watchInterval=null;

async function joinGame(){
  const code=getCode();
  const nick=document.getElementById('iNick').value.trim();
  if(code.length!==6){se(t('eCode'));return;}
  if(!nick){se(t('eNick'));return;}
  const btn=document.getElementById('sbtn');
  btn.classList.add('ld');
  try{
    const sb=await getSb();
    if(!sb){ simulateJoin(code,nick); return; }
    // find room
    const {data:room}=await sb.from('ecogame_rooms').select('*').eq('code',code).single();
    if(!room){se(t('eNotFound'));btn.classList.remove('ld');return;}
    if(room.status==='finished'){se(t('eStarted'));btn.classList.remove('ld');return;}
    myRoomId=room.id;
    // create participant
    const {data:part}=await sb.from('ecogame_participants').insert({
      room_id:room.id, nickname:nick, avatar_emoji:selEmoji, role:'player', is_online:true
    }).select().single();
    myParticipantId=part.id;
    localStorage.setItem('ecogame-participant',JSON.stringify({id:part.id,roomId:room.id,code,nick,emoji:selEmoji}));
    so(t('ok'));
    showWaiting(code,nick);
    if(room.status==='active') goPlay(room.id);
    else watchForStart(room.id);
  }catch(e){se('Ошибка: '+e.message);btn.classList.remove('ld');}
}

function simulateJoin(code,nick){
  localStorage.setItem('ecogame-participant',JSON.stringify({id:'demo',roomId:'demo',code,nick,emoji:selEmoji}));
  showWaiting(code,nick);
}

function showWaiting(code,nick){
  document.getElementById('joinForm').style.display='none';
  const ws=document.getElementById('waitingScreen');
  ws.style.display='block';
  document.getElementById('wCode').textContent=code;
  document.getElementById('wTitle').textContent=t('wTitle');
  document.getElementById('wSub').textContent=t('wSub');
  // update waiting emoji to chosen
  ws.querySelector('.waiting-emoji').textContent=selEmoji;
}

async function watchForStart(roomId){
  if(watchInterval) clearInterval(watchInterval);
  watchInterval=setInterval(async()=>{
    try{
      const sb=await getSb();
      if(!sb) return;
      const {data:room}=await sb.from('ecogame_rooms').select('status,current_q').eq('id',roomId).single();
      // update player count
      const {count}=await sb.from('ecogame_participants').select('*',{count:'exact',head:true}).eq('room_id',roomId).eq('role','player');
      document.getElementById('wPlayerCount').textContent=`${count||0} ${t('wPlayers')}`;
      // keep alive
      if(myParticipantId) await sb.from('ecogame_participants').update({last_seen:new Date(),is_online:true}).eq('id',myParticipantId);
      if(room?.status==='active'){ clearInterval(watchInterval); goPlay(roomId); }
      if(room?.status==='finished'){ clearInterval(watchInterval); window.location.href=`ecogame-results.html?room=${roomId}`; }
    }catch(e){}
  },2000);
}

function goPlay(roomId){
  const p=JSON.parse(localStorage.getItem('ecogame-participant')||'{}');
  window.location.href=`ecogame-play.html?room=${roomId}&pid=${p.id||''}`;
}

applyT();
</script>
</body>
</html>
